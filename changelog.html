<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - CataList</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="./css/reset.css" />
    <link rel="stylesheet" type="text/css" href="./css/typography.css" />
    <link rel="stylesheet" type="text/css" href="./css/main.css" />
    <style>
        body { padding: 40px 20px; font-family: 'Lexend Deca', sans-serif; background-color: #111; color: white; }
        .changelog-container { max-width: 800px; margin: 0 auto; }
        .back-btn { display: inline-block; padding: 10px 20px; background: #333; color: white; text-decoration: none; border-radius: 8px; margin-bottom: 30px; font-weight: 500; transition: 0.2s; }
        .back-btn:hover { background: #444; }
        .log-entry { background: #1a1a1a; padding: 25px; border-radius: 12px; margin-bottom: 20px; border-left: 5px solid #fff; }
        .date { color: #888; font-size: 0.9em; margin-bottom: 8px; display: block; }
        .log-entry h3 { margin-bottom: 10px; font-size: 1.5rem; }
        .log-entry ul { list-style: disc; margin-left: 20px; color: #ccc; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="changelog-container">
        <a href="./index.html" class="back-btn">← Volver a la Lista</a>
        <h1 style="font-size: 2.5rem; margin-bottom: 30px;">Historial de Cambios</h1>
        <div id="historial-lista"></div>
    </div>

    <script>
        fetch('./data/_changelog.json')
            .then(response => response.json())
            .then(data => {
                const contenedor = document.getElementById('historial-lista');
                data.forEach(item => {
                    const listaCambios = item.cambios.map(c => `<li>${c}</li>`).join('');
                    contenedor.innerHTML += `
                        <div class="log-entry">
                            <span class="date">${item.fecha}</span>
                            <h3>${item.titulo}</h3>
                            <ul>${listaCambios}</ul>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
