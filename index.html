       <!-- Contenedor del Buscador Lateral -->
<div id="search-wrapper" style="display: none; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); background-color: transparent;">
    <input type="text" id="buscador-niveles" placeholder="🔍 Buscar nivel..." style="width: 100%; padding: 12px 15px; background-color: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: white; font-family: 'Lexend Deca', sans-serif; font-size: 14px; outline: none; box-sizing: border-box;">
</div>

<script>
    // 1. Filtrar niveles correctamente
    document.addEventListener('input', function(e) {
        if (e.target.id === 'buscador-niveles') {
            const texto = e.target.value.toLowerCase().trim();
            const enlaces = document.querySelectorAll('a'); // Buscar en todos los enlaces
            
            enlaces.forEach(enlace => {
                const contenido = enlace.textContent.toLowerCase().trim();
                // Identificar que es un botón de nivel si empieza con "#" seguido de un número
                if (contenido.match(/^#\d+/)) {
                    if (contenido.includes(texto)) {
                        enlace.style.display = ''; // Mostrar
                    } else {
                        enlace.style.display = 'none'; // Ocultar
                    }
                }
            });
        }
    });

    // 2. Mover el buscador para que NO tape los niveles
    setInterval(() => {
        const isList = window.location.hash === '#/' || window.location.hash === '' || window.location.pathname === '/';
        const buscador = document.getElementById('search-wrapper');
        
        if (buscador) {
            if (isList) {
                buscador.style.display = 'block';
                // Buscar el botón del #1 Bloodbath
                const primerNivel = Array.from(document.querySelectorAll('a')).find(el => el.textContent.trim().startsWith('#1 '));
                
                // Si encontramos el nivel 1 y el buscador aún no está ahí, lo movemos físicamente arriba de él
                if (primerNivel && primerNivel.parentElement && buscador.parentElement !== primerNivel.parentElement) {
                    primerNivel.parentElement.insertBefore(buscador, primerNivel);
                }
            } else {
                // Ocultar si estamos en Leaderboard o Ruleta
                buscador.style.display = 'none'; 
            }
        }
    }, 300);
</script>
