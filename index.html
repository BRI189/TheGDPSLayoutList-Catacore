<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <base href="/">
        <title>CataList - Catacore Team</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.88em' font-size='85' fill='white'>𝕮</text></svg>">
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="./css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./css/typography.css" />
        <link rel="stylesheet" type="text/css" href="./css/main.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="./css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="./js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>CataList</h2>
                <p>Catacore Team</p>
            </div>
            
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                
                <div class="nav__actions">
                    <!-- Modo Oscuro -->
                    <button class="nav__icon" @click.prevent="store.toggleDark()">
                        <img :src="store.dark ? './assets/light.svg' : './assets/dark.svg'" alt="" />
                    </button>
                    
                    <!-- Discord -->
                    <a class="nav__icon" href="TU_LINK_DE_DISCORD" target="_blank">
                        <img src="./assets/discord.svg" alt="Discord Logo" />
                    </a>
                    
                    <!-- Enviar Record -->
                    <a class="nav__cta type-label-lg" href="https://docs.google.com/forms/d/e/1FAIpQLSc6vI6HTKxmYEql6Ik7aRJzEtLfsId0EQzhAO6Ig_XGRYL9fA/viewform?usp=dialog" target="_blank">Enviar Record</a>
                </div>
            </nav>
        </header>
        
        <!-- Botón Historial FIJADO a la pantalla -->
        <a class="nav__cta type-label-lg" href="./changelog.html" style="position: fixed; top: 15px; right: 20px; z-index: 9999; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.4); color: #ffffff; text-decoration: none; padding: 0 20px; height: 36px; display: flex; align-items: center; border-radius: 8px; font-size: 15px;">Historial</a>

        <router-view :class="{ dark: store.dark }"></router-view>

        <script>
            setInterval(() => {
                // 1. Confirmar que estamos en la pestaña de la lista principal
                const isList = window.location.hash === '#/' || window.location.hash === '' || window.location.pathname === '/';
                if (!isList) return;
        
                // 2. Encontrar el nivel #1 para ubicar el contenedor real de Vue
                const enlaces = document.querySelectorAll('a');
                let primerNivel = Array.from(enlaces).find(el => el.textContent.replace(/\s+/g, ' ').trim().startsWith('#1 '));
                
                if (!primerNivel || !primerNivel.parentElement) return;
                
                const contenedorLista = primerNivel.parentElement;
        
                // 3. Inyectar la barra de búsqueda físicamente DENTRO de la lista si no existe
                if (!document.getElementById('buscador-interno')) {
                    const searchHTML = `
                        <div id="buscador-interno" style="padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; background-color: #111; z-index: 10;">
                            <input type="text" id="input-buscador" placeholder="🔍 Buscar nivel..." style="width: 100%; padding: 10px 15px; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-family: 'Lexend Deca', sans-serif; font-size: 14px; outline: none; box-sizing: border-box;">
                        </div>
                    `;
                    
                    // Coloca la barra al principio del contenedor, empujando el #1 naturalmente
                    contenedorLista.insertAdjacentHTML('afterbegin', searchHTML);
        
                    // 4. Lógica de búsqueda aplicada directamente a los hermanos de la barra
                    document.getElementById('input-buscador').addEventListener('input', function(e) {
                        const texto = e.target.value.toLowerCase().trim();
                        
                        // Recorrer todos los elementos dentro de la columna izquierda
                        Array.from(contenedorLista.children).forEach(hijo => {
                            // Evitar ocultar la propia barra de búsqueda
                            if (hijo.id === 'buscador-interno') return;
                            
                            const textoNivel = hijo.textContent.toLowerCase().trim();
                            
                            if (texto === '' || textoNivel.includes(texto)) {
                                // Restauramos la visibilidad forzando la directiva importante
                                hijo.style.setProperty('display', '', 'important'); 
                            } else {
                                // Ocultamos los que no coinciden
                                hijo.style.setProperty('display', 'none', 'important');
                            }
                        });
                    });
                }
            }, 500); // Se ejecuta cada medio segundo para sobrevivir a los cambios de pestaña de Vue
        </script>

    </body>
</html>
