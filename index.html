<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <base href="/">
        <title>CataList - Catacore Team</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.88em' font-size='85' fill='white'>𝕮</text></svg>">
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="./css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./css/typography.css" />
        <link rel="stylesheet" type="text/css" href="./css/main.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="./css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="./js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>CataList</h2>
                <p>Catacore Team</p>
            </div>
            
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                
                <div class="nav__actions">

                    <input type="text" id="buscador-niveles" placeholder=" Buscar..." style="width: 160px; margin-right: 15px; padding: 8px 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; color: white; outline: none; font-family: 'Lexend Deca', sans-serif;">

                    <!-- Modo Oscuro -->
                    <button class="nav__icon" @click.prevent="store.toggleDark()">
                        <img :src="store.dark ? './assets/light.svg' : './assets/dark.svg'" alt="" />
                    </button>
                    
                    <!-- Discord -->
                    <a class="nav__icon" href="TU_LINK_DE_DISCORD" target="_blank">
                        <img src="./assets/discord.svg" alt="Discord Logo" />
                    </a>
                    
                    <!-- Enviar Record -->
                    <a class="nav__cta type-label-lg" href="https://docs.google.com/forms/d/e/1FAIpQLSc6vI6HTKxmYEql6Ik7aRJzEtLfsId0EQzhAO6Ig_XGRYL9fA/viewform?usp=dialog" target="_blank">Enviar Record</a>
                </div>
            </nav>
        </header>
        
        <!-- Botón Historial FIJADO a la pantalla -->
        <a class="nav__cta type-label-lg" href="./changelog.html" style="position: fixed; top: 15px; right: 20px; z-index: 9999; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.4); color: #ffffff; text-decoration: none; padding: 0 20px; height: 36px; display: flex; align-items: center; border-radius: 8px; font-size: 15px;">Historial</a>

        <router-view :class="{ dark: store.dark }"></router-view>

        <script>
            const buscador = document.getElementById('buscador-niveles');
            let textoBusqueda = "";
        
            if (buscador) {
                buscador.addEventListener('input', (e) => {
                    textoBusqueda = e.target.value.toLowerCase().trim();
                    aplicarFiltro();
                });
            }
        
            function aplicarFiltro() {
                const enlaces = document.querySelectorAll('a');
                enlaces.forEach(enlace => {
                    // Limpiamos saltos de línea y espacios invisibles para que la búsqueda no falle
                    const textoLimpio = enlace.textContent.replace(/\s+/g, ' ').trim().toLowerCase();
                    
                    // Detectar que es un nivel buscando un "#" seguido de números, ignorando los botones del menú superior
                    if (/#\d+/.test(textoLimpio) && !enlace.closest('.nav')) {
                        if (textoBusqueda === '' || textoLimpio.includes(textoBusqueda)) {
                            enlace.style.setProperty('display', '', 'important');
                        } else {
                            enlace.style.setProperty('display', 'none', 'important');
                        }
                    }
                });
            }
        
            // El arma secreta: Vigila a Vue.js constantemente
            const observer = new MutationObserver(() => {
                if (textoBusqueda !== "") {
                    aplicarFiltro();
                }
            });
        
            // Solo observa cambios estructurales (si Vue añade o quita elementos) para no crear un bucle infinito
            observer.observe(document.body, { childList: true, subtree: true });
        </script>

    </body>
</html>
