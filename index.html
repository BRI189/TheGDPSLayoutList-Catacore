        <!-- 1. Clases CSS Inmunes -->
<style>
    .ocultar-nivel { display: none !important; }
    .empujar-lista { margin-top: 85px !important; }
</style>

<!-- 2. Buscador Totalmente Independiente -->
<div id="buscador-flotante" style="display: none; position: fixed; top: 64px; left: 0; width: 320px; background-color: #111; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 9999; box-sizing: border-box;">
    <input type="text" id="input-nivel" placeholder="🔍 Buscar nivel..." style="width: 100%; padding: 10px 15px; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-family: 'Lexend Deca', sans-serif; font-size: 14px; outline: none;">
</div>

<!-- 3. Script Forzado (Se ejecuta 10 veces por segundo) -->
<script>
    setInterval(() => {
        const buscador = document.getElementById('buscador-flotante');
        if (!buscador) return;

        // Comprueba si estamos en la pestaña principal
        const isList = window.location.hash === '#/' || window.location.hash === '' || window.location.pathname === '/';
        if (!isList) {
            buscador.style.display = 'none';
            return;
        }
        
        buscador.style.display = 'block';
        const texto = document.getElementById('input-nivel').value.toLowerCase().trim();
        
        // Identificar todos los enlaces que sean niveles (Ej: "#1 Bloodbath")
        const enlaces = document.querySelectorAll('a');
        const niveles = Array.from(enlaces).filter(el => /^\s*#\d+/.test(el.textContent));
        
        let primerVisible = null;

        niveles.forEach(nivel => {
            nivel.classList.remove('empujar-lista'); // Limpiar para recalcular
            
            // Lógica de búsqueda
            if (texto === '' || nivel.textContent.toLowerCase().includes(texto)) {
                nivel.classList.remove('ocultar-nivel');
                // Guardamos en memoria cuál es el primer nivel que pasó el filtro
                if (!primerVisible) primerVisible = nivel; 
            } else {
                nivel.classList.add('ocultar-nivel');
            }
        });

        // Aplicamos el margen hacia abajo ÚNICAMENTE al primer nivel de la lista visible
        if (primerVisible) {
            primerVisible.classList.add('empujar-lista');
        }
    }, 100);
</script>
