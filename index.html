<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <base href="/">
        <title>CataList - Catacore Team</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.88em' font-size='85' fill='white'>𝕮</text></svg>">
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="./css/reset.css" />
        <link rel="stylesheet" type="text/css" href="./css/typography.css" />
        <link rel="stylesheet" type="text/css" href="./css/main.css" />
        <link rel="stylesheet" type="text/css" href="./css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="./css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="./css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="./css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="./js/main.js"></script>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>CataList</h2>
                <p>Catacore Team</p>
            </div>
            
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                
                <div class="nav__actions">

                    <!-- Modo Oscuro -->
                    <button class="nav__icon" @click.prevent="store.toggleDark()">
                        <img :src="store.dark ? './assets/light.svg' : './assets/dark.svg'" alt="" />
                    </button>
                    
                    <!-- Discord -->
                    <a class="nav__icon" href="TU_LINK_DE_DISCORD" target="_blank">
                        <img src="./assets/discord.svg" alt="Discord Logo" />
                    </a>
                    
                    <!-- Enviar Record -->
                    <a class="nav__cta type-label-lg" href="https://docs.google.com/forms/d/e/1FAIpQLSc6vI6HTKxmYEql6Ik7aRJzEtLfsId0EQzhAO6Ig_XGRYL9fA/viewform?usp=dialog" target="_blank">Enviar Record</a>
                </div>
            </nav>
        </header>
        
        <!-- Botón Historial FIJADO a la pantalla -->
        <a class="nav__cta type-label-lg" href="./changelog.html" style="position: fixed; top: 15px; right: 20px; z-index: 9999; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.4); color: #ffffff; text-decoration: none; padding: 0 20px; height: 36px; display: flex; align-items: center; border-radius: 8px; font-size: 15px;">Historial</a>

        <router-view :class="{ dark: store.dark }"></router-view>

        <style>
            .link-verificador:hover {
                color: #93c5fd !important;
                text-shadow: 0 0 8px rgba(96, 165, 250, 0.6);
            }
        </style>
        
        <script>
            let ultimoNivel = "";
            let linkOriginalJson = "";
        
            setInterval(async () => {
                // 1. Buscar la etiqueta VERIFIER visible en pantalla
                const elementos = document.querySelectorAll('h1, h2, h3, h4, h5, p, span, strong, b, div');
                let etiquetaVerifier = null;
                
                for (let el of elementos) {
                    if (el.textContent.trim() === 'VERIFIER' && el.children.length === 0) {
                        etiquetaVerifier = el;
                        break;
                    }
                }
        
                if (!etiquetaVerifier) return;
                let cajaNombre = etiquetaVerifier.nextElementSibling;
                
                // Si no hay un nombre de verificador, o si ya lo convertimos en link, cancelamos
                if (!cajaNombre || cajaNombre.querySelector('.link-verificador') || cajaNombre.textContent.trim() === '') return;
        
                // 2. Extraer el nombre del nivel para buscar su archivo
                // La plantilla de Vue cambia la URL cuando haces clic (ej: #/eyes_in_the_water)
                let idUrl = window.location.hash.replace('#/', '').split('?')[0].replace('#', '');
                
                // Respaldo: Si la URL falla, lee el texto del título principal de la página
                if (!idUrl) {
                    let tituloDom = document.querySelector('h1');
                    if (tituloDom) idUrl = tituloDom.textContent.trim().toLowerCase().replace(/\s+/g, '_');
                }
        
                if (!idUrl) return;
        
                // 3. Leer silenciosamente tu archivo .json en la carpeta data/
                if (idUrl !== ultimoNivel) {
                    ultimoNivel = idUrl;
                    linkOriginalJson = ""; // Limpiamos la variable al cambiar de nivel
        
                    try {
                        // Hacemos una petición interna al archivo (ej: data/eyes_in_the_water.json)
                        let peticion = await fetch(`data/${idUrl}.json`);
                        if (peticion.ok) {
                            let jsonDatos = await peticion.json();
                            // Extraemos el link exacto que pusiste con el .exe
                            linkOriginalJson = jsonDatos.verification; 
                        }
                    } catch (error) {
                        console.error("No se pudo leer el archivo .json para el verificador.");
                    }
                }
        
                // 4. Inyectar el link directamente al texto
                if (linkOriginalJson && linkOriginalJson !== "") {
                    let nombreVerificador = cajaNombre.textContent.trim();
                    cajaNombre.innerHTML = `<a href="${linkOriginalJson}" target="_blank" class="link-verificador" style="color: #60a5fa; text-decoration: underline; cursor: pointer; transition: 0.2s;">${nombreVerificador}</a>`;
                }
            }, 500);
        </script>
        
    </body>
</html>
