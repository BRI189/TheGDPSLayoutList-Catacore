    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>CataList</h2>
                <p>Catacore Team</p>
            </div>
            
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                
                <div class="nav__actions">

                    <!-- Modo Oscuro -->
                    <button class="nav__icon" @click.prevent="store.toggleDark()">
                        <img :src="store.dark ? './assets/light.svg' : './assets/dark.svg'" alt="" />
                    </button>
                    
                    <!-- Discord -->
                    <a class="nav__icon" href="TU_LINK_DE_DISCORD" target="_blank">
                        <img src="./assets/discord.svg" alt="Discord Logo" />
                    </a>
                    
                    <!-- Enviar Record -->
                    <a class="nav__cta type-label-lg" href="https://docs.google.com/forms/d/e/1FAIpQLSc6vI6HTKxmYEql6Ik7aRJzEtLfsId0EQzhAO6Ig_XGRYL9fA/viewform?usp=dialog" target="_blank">Enviar Record</a>
                </div>
            </nav>
        </header>
        
        <!-- Botón Historial FIJADO a la pantalla -->
        <a class="nav__cta type-label-lg" href="./changelog.html" style="position: fixed; top: 15px; right: 20px; z-index: 9999; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.4); color: #ffffff; text-decoration: none; padding: 0 20px; height: 36px; display: flex; align-items: center; border-radius: 8px; font-size: 15px;">Historial</a>

        <router-view :class="{ dark: store.dark }"></router-view>

        <style>
            /* Efecto brillante cuando le pasas el mouse al verificador */
            .link-verificador:hover {
                color: #93c5fd !important;
                text-shadow: 0 0 8px rgba(96, 165, 250, 0.6);
            }
        </style>
        
        <style>
            .link-verificador {
                color: #60a5fa !important;
                text-decoration: underline !important;
                cursor: pointer;
                transition: 0.2s ease;
            }
            .link-verificador:hover {
                color: #93c5fd !important;
                text-shadow: 0 0 8px rgba(96, 165, 250, 0.6);
            }
        </style>
        
        <script>
            setInterval(() => {
                // 1. Encontrar el iframe y generar el link final
                const iframe = document.querySelector('iframe');
                if (!iframe || !iframe.src) return;
                
                let linkFinal = iframe.src;
                if (linkFinal.includes('youtube.com/embed/')) {
                    let id = linkFinal.split('embed/')[1].split('?')[0];
                    if (id.startsWith('tiktok-')) {
                        linkFinal = `https://www.tiktok.com/video/${id.replace('tiktok-', '')}`;
                    } else {
                        linkFinal = `https://www.youtube.com/watch?v=${id}`;
                    }
                } else if (linkFinal.includes('tiktok.com/embed/v2/')) {
                    let id = linkFinal.split('v2/')[1].split('?')[0];
                    linkFinal = `https://www.tiktok.com/video/${id}`;
                }
        
                // 2. Buscar la etiqueta VERIFIER en toda la página
                // Evaluamos todos los elementos de texto comunes en la plantilla
                const elementos = document.querySelectorAll('h1, h2, h3, h4, h5, h6, div, p, span, strong, b');
                let etiquetaVerifier = null;
        
                for (let el of elementos) {
                    // Si el elemento dice exactamente VERIFIER y no tiene otros elementos por dentro
                    if (el.textContent.trim() === 'VERIFIER' && el.children.length === 0) {
                        etiquetaVerifier = el;
                        break;
                    }
                }
        
                // 3. Convertir el nombre de al lado en un enlace
                if (etiquetaVerifier) {
                    // En esta plantilla, el nombre siempre es la caja que le sigue a la etiqueta
                    let cajaNombre = etiquetaVerifier.nextElementSibling;
                    
                    // Si encontramos la caja y aún no tiene el enlace puesto
                    if (cajaNombre && !cajaNombre.querySelector('.link-verificador')) {
                        let nombre = cajaNombre.textContent.trim();
                        
                        // Si el nivel tiene verificador (no está vacío)
                        if (nombre.length > 0) {
                            cajaNombre.innerHTML = `<a href="${linkFinal}" target="_blank" class="link-verificador" title="Ver video de verificación">${nombre}</a>`;
                        }
                    }
                }
            }, 400);
        </script>

    </body>
</html>
