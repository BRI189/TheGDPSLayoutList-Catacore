    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">

            <nav class="nav">
                <router-link class="nav__tab" to="/">

                <router-link class="nav__tab" to="/leaderboard">

                <router-link class="nav__tab" to="/roulette">

                </router-link>
                
                <div class="nav__actions">
                    <!-- Modo Oscuro -->
                    <button class="nav__icon" @click.prevent="store.toggleDark()">
                        <img :src="store.dark ? './assets/light.svg' : './assets/dark.svg'" alt="" />

                    <!-- Discord -->
                    <a class="nav__icon" href="TU_LINK_DE_DISCORD" target="_blank">

                </div>

        </header>
        
        <!-- Botón Historial FIJADO a la pantalla -->
        <a class="nav__cta type-label-lg" href="./changelog.html" style="position: fixed; top: 15px; right: 20px; z-index: 9999; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.4); color: #ffffff; text-decoration: none; padding: 0 20px; height: 36px; display: flex; align-items: center; border-radius: 8px; font-size: 15px;">Historial</a>

        <router-view :class="{ dark: store.dark }"></router-view>

   <!-- Buscador Fijo -->
<div id="search-container" style="position: fixed; top: 64px; left: 0; width: 320px; height: 60px; z-index: 9999; background-color: #111; padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); box-sizing: border-box; display: flex; align-items: center;">
    <input type="text" id="buscador-niveles" placeholder="🔍 Buscar nivel..." style="width: 100%; padding: 8px 12px; background-color: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: white; font-family: 'Lexend Deca', sans-serif; font-size: 14px; outline: none;">
</div>

<!-- Buscador y Estilos Globales -->
<style>
    /* Forzamos el espacio en la lista para que la barra no tape el top 1 */
    .espacio-buscador { padding-top: 75px !important; }
    /* Clase invencible para ocultar los niveles que no coincidan */
    .escondido { display: none !important; }
</style>

<div id="search-container" style="display: none; position: fixed; top: 64px; left: 0; height: 75px; z-index: 9999; background-color: #111; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); box-sizing: border-box; align-items: center;">
    <input type="text" id="buscador-niveles" placeholder="🔍 Buscar nivel..." style="width: 100%; padding: 10px 15px; background-color: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-family: 'Lexend Deca', sans-serif; font-size: 14px; outline: none;">
</div>

<script>
    // 1. Filtrado apuntando a la clase exacta de la plantilla (.list__link)
    document.addEventListener('input', function(e) {
        if (e.target.id === 'buscador-niveles') {
            const texto = e.target.value.toLowerCase().trim();
            // Seleccionamos específicamente los botones de la lista de niveles
            const niveles = document.querySelectorAll('.list__link'); 
            
            niveles.forEach(nivel => {
                const nombreNivel = nivel.textContent.toLowerCase();
                
                if (texto === '' || nombreNivel.includes(texto)) {
                    nivel.classList.remove('escondido');
                } else {
                    nivel.classList.add('escondido');
                }
            });
        }
    });

    // 2. Control de posición y tamaño adaptativo
    setInterval(() => {
        const buscador = document.getElementById('search-container');
        if (!buscador) return;

        const isList = window.location.hash === '#/' || window.location.hash === '' || window.location.pathname === '/';
        
        if (isList) {
            buscador.style.display = 'flex';
            
            // Buscar el primer nivel para empujar a su contenedor padre (la columna)
            const primerNivel = document.querySelector('.list__link');
            if (primerNivel && primerNivel.parentElement) {
                primerNivel.parentElement.classList.add('espacio-buscador');
                // Ajustar la barra para que mida exactamente lo mismo que la columna
                buscador.style.width = primerNivel.parentElement.offsetWidth + 'px';
            }
        } else {
            buscador.style.display = 'none'; // Ocultar si cambias de pestaña
        }
    }, 300);
</script>

    </body>
</html>
